name: smart_travel_weather_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Path and storage dependencies
  path: ^1.9.1
  path_provider: ^2.1.5
  
  # State management
  provider: ^6.1.1
  
  # Database dependencies
  sqflite: ^2.3.2
  sqflite_common_ffi: ^2.3.3
  sqflite_common: ^2.5.3
  sqflite_common_ffi_web: ^1.0.1+1
  
  # Shared preferences
  shared_preferences: ^2.2.2
  shared_preferences_web: ^2.4.3
  shared_preferences_android: ^2.2.1
  
  # HTTP and API
  http: ^1.2.0
  
  # PDF generation
  pdf: ^3.11.0
  printing: ^5.10.4
  
  # Utilities
  url_launcher: ^6.1.7
  form_validator: ^2.1.1
  intl: ^0.20.2
  uuid: ^4.3.3
  
  # Chat and AI
  chat_gpt_sdk: ^2.0.0
  flutter_dotenv: ^6.0.0
  flutter_markdown: ^0.6.18

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/smartravel.png
