name: smart_travel_weather_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Path and storage dependencies
  path: ^1.9.1
  path_provider: ^2.1.5
  
  # State management
  provider: ^6.1.1
  
  # Database dependencies
  sqflite: ^2.3.2
  sqflite_common_ffi: ^2.3.3
  sqflite_common: ^2.5.3
  sqflite_common_ffi_web: ^1.0.1+1
  
  # Shared preferences
  shared_preferences: ^2.2.2
  shared_preferences_web: ^2.4.3
  shared_preferences_android: ^2.2.1
  
  # HTTP and API
  http: ^1.1.0
  
  # PDF generation
  pdf: ^3.11.0
  printing: ^5.10.4
  permission_handler: ^11.3.0
  
  # Utilities
  url_launcher: ^6.1.7
  form_validator: ^2.1.1
  intl: ^0.18.1
  uuid: ^4.3.3
  
  # Charts
  fl_chart: ^0.69.0
  
  # Chat and AI
  chat_gpt_sdk: ^2.0.0
  flutter_dotenv: ^6.0.0
  flutter_markdown: ^0.6.18

  # Image picker
  image_picker: ^1.0.7
  image_picker_web: ^3.1.1
  
  # UI Components
  google_fonts: ^6.1.0
  
  # Authentication - Using only Google for now to avoid conflicts
  firebase_core: ^2.15.1
  firebase_auth: ^4.9.0
  google_sign_in: ^6.1.4

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  #
  share_plus: ^7.0.1  # for pdf

  # WebView
  webview_flutter: ^4.7.0
  flutter_inappwebview: ^6.1.5  # For reCAPTCHA implementation

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/smartravel.png
    - .env
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/smartravel.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/smartravel.png"
    background_color: "#ffffff"
    theme_color: "#0175C2"
  windows:
    generate: true
    image_path: "assets/smartravel.png"
    icon_size: 48

